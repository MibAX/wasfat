<div class="card">
    <div class="card-header">
        <div class="row">
            <div class="col-md-6">
                <!-- Left card header -->
            </div>

            <div class="col-md-6 text-end">
                <!-- right card header -->
                <button type="button" mat-stroked-button color="primary" (click)="openDialog()">
                    New Category
                </button>
            </div>

        </div>
    </div>
    <div class="card-body">
        <div class="row">
            <ngx-datatable [rows]="categories" default>
                <ngx-datatable-column [name]="'Number'" prop="id"></ngx-datatable-column>

                <ngx-datatable-column name="Name" prop="name"></ngx-datatable-column>

                <ngx-datatable-column name="Edit">
                    <ng-template let-row="row" ngx-datatable-cell-template>
                        <button mat-stroked-button color="primary" (click)="openDialog(row.id)" class="me-3">
                            Edit
                        </button>
                    </ng-template>
                </ngx-datatable-column>

                <ngx-datatable-column name="Associated Recipes">
                    <ng-template let-row="row" ngx-datatable-cell-template>
                        <a [routerLink]="['/recipes/list']" [queryParams]="getQueryParams(row.id)" class="d-flex align-self-center text-decoration-none">
                            <i class="fas fa-list-ul fs-5 text-primary" [matTooltip]="row.recipesCount + ' Recipes'" [matTooltipPosition]="'right'"></i>
                        </a>
                    </ng-template>
                </ngx-datatable-column>

            </ngx-datatable>
        </div>
    </div>
</div>
