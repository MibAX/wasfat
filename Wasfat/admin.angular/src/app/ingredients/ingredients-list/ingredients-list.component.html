<div class="card">
    <div class="card-header">
        <div class="row">
            <div class="col-md-6">
                <!-- Left card header -->
            </div>

            <div class="col-md-6 text-end">
                <!-- right card header -->
                <button type="button" mat-stroked-button color="primary">
                    New Ingredient
                </button>
            </div>

        </div>
    </div>
    <div class="card-body">
        <div class="row">
            <ngx-datatable [rows]="ingredients" default>
                <ngx-datatable-column [name]="'Number'" prop="id"></ngx-datatable-column>
                <ngx-datatable-column [name]="'Ingredient Name'" prop="name"></ngx-datatable-column>

                <ngx-datatable-column name="Associated Recipes">
                    <ng-template let-row="row" ngx-datatable-cell-template>
                        <a [routerLink]="['/recipes/list']" class="d-flex align-self-center text-decoration-none">
                            <i class="fas fa-list-ul fs-5 text-primary"></i>
                        </a>
                    </ng-template>
                </ngx-datatable-column>
                
                <ngx-datatable-column [name]="'Edit'">
                    <ng-template let-row="row" ngx-datatable-cell-template>
                        <button mat-stroked-button color="primary">
                            Edit
                        </button>
                    </ng-template>
                </ngx-datatable-column>
            </ngx-datatable>
        </div>
    </div>
</div>
