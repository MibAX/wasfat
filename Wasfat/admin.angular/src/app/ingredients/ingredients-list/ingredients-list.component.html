<div class="card">
    <div class="card-header">
        <div class="row">
            <div class="col-md-6"></div>
            <div class="col-md-6 text-end">
                <button type="button" mat-stroked-button color="primary" (click)="openDialog()">
                    New Ingredient
                </button>
            </div>
        </div>
    </div>
    <div class="card-body">
        <div class="row">
            <ngx-datatable [rows]="ingredients" default>
                <ngx-datatable-column name="Number" prop="id"></ngx-datatable-column>
                <ngx-datatable-column name="Category Name" prop="name"></ngx-datatable-column>

                <ngx-datatable-column name="Edit">
                    <ng-template let-row="row" ngx-datatable-cell-template>
                        <button mat-stroked-button color="primary" (click)="openDialog(row.id)">
                            Edit
                        </button>
                    </ng-template>
                </ngx-datatable-column>
            </ngx-datatable>
        </div>
    </div>
</div>
