<div class="card">
  <div class="card-header">
    <button mat-stroked-button color="warn" class="me-2" (click)="cancel()">Cancel</button>
    <button mat-stroked-button color="primary" (click)="save()">
      {{ isEditMode ? 'Save' : 'Create' }}
    </button>
  </div>

  <div class="card-body">
    <form [formGroup]="FormGroup">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name" placeholder="Enter recipe name" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Description</mat-label>
        <textarea matInput formControlName="description" placeholder="Enter recipe description"></textarea>
      </mat-form-field>

      <div class="card" *ngIf="recipe?.instructions.length > 0">
        <div class="card-header text-center fw-bold">
          <h2 class="m-0">Details</h2>
        </div>
        <div class="card-body">
          <p><strong class="me-2">Recipe:</strong> {{recipe.name}}</p>
          <p><strong class="me-2">Description:</strong> {{recipe.description}}</p>

          <p class="fw-bold">Instructions:</p>
          <table class="table table-bordered table-striped table-sm mb-0">
            <thead>
              <tr>
                <th class="w-75">Text</th>
                <th class="w-25">Order</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let instruction of recipe.instructions">
                <td>{{ instruction.text }}</td>
                <td>{{ instruction.order }}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </form>
  </div>
</div>
