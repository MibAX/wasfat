<div class="card">
    <div class="card-header">
        <button mat-stroked-button color="warn" class="me-2" (click)="cancel()">Cancel</button>
        <button mat-stroked-button color="primary" (click)="save()">
            {{ isEditMode ? 'Save' : 'Create' }}
        </button>
    </div>

    <div class="card-body">
        <form [formGroup]="form">
            <mat-form-field appearance="outline" class="w-100 mb-3">
                <mat-label>Name</mat-label>
                <input matInput formControlName="name" placeholder="Enter recipe name" />
            </mat-form-field>

            <mat-form-field appearance="outline" class="w-100 mb-3">
                <mat-label>Description</mat-label>
                <textarea matInput formControlName="description" placeholder="Enter recipe description"></textarea>
            </mat-form-field>

            <mat-form-field appearance="outline" class="w-100 mb-3">
                <mat-label>Categories</mat-label>
                <mat-select formControlName="categoryIds" multiple>
                    <mat-select-trigger>
                        <mat-chip-set>
                            <mat-chip *ngFor="let categoryId of categoryIds.value" highlighted color="primary"
                                [removable]="true" (removed)="removeCategory(categoryId)">
                                <span>{{ getCategoryLabel(categoryId) }}</span>
                                <button matChipRemove>
                                    <mat-icon>cancel</mat-icon>
                                </button>
                            </mat-chip>
                        </mat-chip-set>
                    </mat-select-trigger>
                    <mat-option *ngFor="let category of categoryLookups"
                        [value]="category.id">{{category.displayName}}</mat-option>
                </mat-select>
            </mat-form-field>

            <div class="card mb-3">
                <div class="card-header">
                    <div class="row">
                        <div class="col-4"></div>
                        <p class="col-4 fs-5 fw-bold text-center my-0">Recipe Ingredients</p>
                        <div class="col-4"></div>
                    </div>
                </div>
                <div class="card-body">
                    <mat-form-field appearance="outline" class="w-100 mb-3">
                        <mat-label>Ingredient</mat-label>
                        <input type="text" matInput [formControl]="ingredientAutoCompleteControl"
                            [matAutocomplete]="ingredientAutoComplete" placeholder="Search ingredients..." />

                        <mat-autocomplete #ingredientAutoComplete="matAutocomplete">
                            <mat-option *ngFor="let suggestedIngredient of suggestedIngredients$ | async" [value]="suggestedIngredient?.id">
                                {{ suggestedIngredient?.displayName }}
                            </mat-option>
                        </mat-autocomplete>
                    </mat-form-field>

                    <div formArrayName="recipeIngredients">
                        <div *ngFor="let recipeIngredient of recipeIngredientsArray.controls; let i = index"
                            [formGroupName]="i" class="border rounded p-3">
                            <div class="row">
                                <div class="col-5">
                                    <mat-form-field appearance="outline" class="w-100">
                                        <mat-label>Ingredient</mat-label>
                                        <input matInput type="text" readonly
                                            [value]="getIngredientLabel(recipeIngredient.get('ingredientId').value)">
                                    </mat-form-field>
                                </div>
                                <div class="col-3">
                                    <mat-form-field appearance="outline" class="w-100">
                                        <mat-label>Quantity</mat-label>
                                        <input matInput type="number" formControlName="quantity">
                                    </mat-form-field>
                                </div>
                                <div class="col-3">
                                    <mat-form-field appearance="outline" class="w-100">
                                        <mat-label>Unit</mat-label>
                                        <mat-select formControlName="unit">
                                            <mat-option *ngFor="let measurementUnitOption of measurementUnitOptions"
                                                [value]="measurementUnitOption.value">
                                                {{measurementUnitOption.key}}
                                            </mat-option>
                                        </mat-select>
                                    </mat-form-field>
                                </div>
                                <div class="col-1">
                                    <div class="d-flex h-100 w-100 justify-content-center align-items-center">
                                        <button type="button" mat-icon-button color="warn">
                                            <i class="fas fa-trash-alt"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <div class="row">
                        <mat-slide-toggle class="col-4" color="primary" [checked]="isDragEnabled"
                            [disabled]="instructionsArray.length < 2" (change)="toggleDragDrop($event)">
                            Recipe Instructions
                        </mat-slide-toggle>
                        <p class="col-4 fs-5 fw-bold text-center my-0">Instructions</p>
                        <div class="col-4"></div>
                    </div>
                </div>
                <div class="card-body">
                    <ng-container formArrayName="instructions">
                        <div cdkDropList (cdkDropListDropped)="drop($event)">
                            <div *ngFor="let instruction of instructionsArray.controls; let i = index"
                                [formGroupName]="i" class="border rounded mb-3 p-3"
                                [ngClass]="{'instruction-item' : isDragEnabled}" cdkDrag
                                [cdkDragDisabled]="!isDragEnabled" cdkDragLockAxis="y" cdkDragBoundary=".card-body">
                                <div class="row">
                                    <div class="col-2">
                                        <mat-form-field appearance="outline" class="w-100">
                                            <mat-label>Order</mat-label>
                                            <input matInput formControlName="order" type="number" readonly>
                                        </mat-form-field>
                                    </div>
                                    <div class="col-9">
                                        <mat-form-field appearance="outline" class="w-100">
                                            <mat-label>Instruction</mat-label>
                                            <input matInput formControlName="text" placeholder="Enter instruction">
                                        </mat-form-field>
                                    </div>
                                    <div class="col-1">
                                        <div class="d-flex h-100 w-100 justify-content-center align-items-center">
                                            <button type="button" mat-icon-button color="warn"
                                                (click)="removeInstruction(i)">
                                                <i class="fas fa-trash-alt"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="row px-3">
                                <div class="offset-11 col-1">
                                    <div class="d-flex h-100 w-100 justify-content-center align-items-center">
                                        <button type="button" mat-icon-button color="primary"
                                            (click)="addInstruction()">
                                            <i class="fas fa-plus"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </ng-container>
                </div>
            </div>
        </form>
    </div>
</div>
