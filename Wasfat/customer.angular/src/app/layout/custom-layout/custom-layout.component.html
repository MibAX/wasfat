<nav class="navbar navbar-expand-lg">
    <div class="container nav-container">
        <a class="navbar-brand" href="/">
            <img src="/assets/images/logo/tasty-bites-rectangular-logo.png" alt="Logo">
        </a>

        <form [formGroup]="searchForm" class="center-search">
            <mat-form-field appearance="outline" class="w-100 bg-white">
                <input type="text" matInput formControlName="recipeAutoCompleteControl"
                    [matAutocomplete]="recipeAutoComplete" placeholder="Search recipes..." />

                <mat-autocomplete #recipeAutoComplete="matAutocomplete" (optionSelected)="onRecipeSelected($event)">
                    <mat-option *ngFor="let suggestedRecipe of suggestedRecipes$ | async"
                        [value]="suggestedRecipe?.id">
                        {{ suggestedRecipe?.displayName }}
                    </mat-option>
                </mat-autocomplete>
            </mat-form-field>
        </form>

        <button class="navbar-toggler" type="button" (click)="toggleCollapse()" [attr.aria-expanded]="!isCollapsed"
            aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="navbar-collapse" [ngbCollapse]="isCollapsed">
            <ul class="navbar-nav ms-auto my-2 my-lg-0">
                <li class="nav-item">
                    <a class="nav-link" routerLink="/" routerLinkActive="active"
                        [routerLinkActiveOptions]="{exact: true}">
                        <i class="fas fa-home me-1"></i><span>Home</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" routerLink="/recipes/list" routerLinkActive="active">
                        <i class="fas fa-utensils me-1"></i><span>Recipes</span>
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>
