<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm flex-column flex-md-row mb-4" id="main-navbar"
    style="min-height: 4rem">
    <div class="container">
        <abp-logo *abpReplaceableTemplate="{ componentKey: 'LogoComponent' }"></abp-logo>

        <button class="navbar-toggler" type="button" [attr.aria-expanded]="!isCollapsed" (click)="toggleCollapse()">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="navbar-collapse" [class.overflow-hidden]="smallScreen" id="main-navbar-collapse">
            <ng-container *ngIf="!smallScreen">
                <ng-container *ngTemplateOutlet="navigations"></ng-container>
            </ng-container>

            <div *ngIf="smallScreen" [@collapseWithMargin]="isCollapsed ? 'collapsed' : 'expanded'">
                <ng-container *ngTemplateOutlet="navigations"></ng-container>
            </div>

            <ng-template #navigations>
                <abp-routes *abpReplaceableTemplate="{
            componentKey: 'RoutesComponent',
            inputs: { smallScreen: { value: smallScreen } }
          }" class="mx-auto" [smallScreen]="smallScreen"></abp-routes>

                <abp-nav-items *abpReplaceableTemplate="{ componentKey: 'NavItemsComponent' }"></abp-nav-items>
            </ng-template>
        </div>
    </div>
</nav>

<div>
    <abp-page-alert-container></abp-page-alert-container>
    <router-outlet></router-outlet>
    <abp-confirmation></abp-confirmation>
</div>
