<section id="hero-section">
    <div class="card p-4 my-4 rounded-3 inner-shadow">
        <div class="row flex-lg-row flex-column-reverse">
            <div class="col-lg-6">
                <form [formGroup]="searchForm" class="mt-lg-0 mt-3">
                    <mat-form-field appearance="outline" class="w-100 mb-3 bg-white ff-rakkas">
                        <input type="text" matInput formControlName="recipeAutoCompleteControl"
                            [matAutocomplete]="recipeAutoComplete" placeholder="Search recipes..." />

                        <mat-autocomplete #recipeAutoComplete="matAutocomplete"
                            (optionSelected)="onRecipeSelected($event)">
                            <mat-option *ngFor="let suggestedRecipe of suggestedRecipes$ | async"
                                [value]="suggestedRecipe?.id" class="ff-rakkas">
                                {{ suggestedRecipe?.displayName }}
                            </mat-option>
                        </mat-autocomplete>
                    </mat-form-field>
                </form>
            </div>
            <div class="col-lg-6">
                <ngb-carousel>
                    <ng-template *ngFor="let recipe of heroDisplayedRecipes" ngbSlide>
                        <div class="picsum-img-wrapper">
                            <img [src]="apiUrl + recipe.imageUrl" [alt]="recipe.name" class="img-fluid rounded-3"/>
                        </div>
                        <div class="carousel-caption">
                            <h3 class="ff-rakkas">{{recipe.name}}</h3>
                            <p class="ff-rakkas">{{recipe.description | firstWords:7}}.</p>
                        </div>
                    </ng-template>
                </ngb-carousel>
            </div>
        </div>
    </div>
</section>
