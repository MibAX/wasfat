<div class="bg-white">
    <ngb-carousel class="hero-carousel" [showNavigationArrows]="true" [showNavigationIndicators]="false">
        <ng-template *ngFor="let recipe of heroDisplayedRecipes" ngbSlide>
            <div class="carousel-img-wrapper">
                <img [src]="apiUrl + recipe.imageUrl" [alt]="recipe.name" class="d-block" />
            </div>

            <div class="carousel-caption">
                <div class="container">
                    <h1 class="fw-bold">{{recipe.name}}</h1>
                    <p class="mt-3">{{recipe.description}}</p>
                    <div class="d-flex flex-lg-row flex-column justify-content-center gap-3 mt-4">
                        <a [routerLink]="['/recipes/list']" class="btn btn-lg custom-btn-primary">
                            Explore Recipes
                        </a>
                        <a [routerLink]="['/recipes/details', recipe.id]" class="btn btn-lg custom-btn-secondary">
                            View Recipe
                        </a>
                    </div>
                </div>
            </div>
        </ng-template>
    </ngb-carousel>

    <section class="featured-recipes py-4">
        <div class="container">
            <div class="featured-heading">
                <h2 class="fw-bold">Featured Recipes</h2>
                <a [routerLink]="['/recipes/list']">
                    <span class="me-3">Explore Recipes</span>
                    <i class="fas fa-angle-right"></i>
                </a>
            </div>

            <div class="row pt-4 g-4">
                <div *ngFor="let recipe of featuredRecipes" class="col-lg-4 col-md-6">
                    <div class="card">
                        <img [src]="apiUrl + recipe.imageUrl" alt="recipe.name" class="img-fluid rounded-3">
                        <div class="card-body d-flex flex-column">
                            <h4>{{recipe.name}}</h4>
                            <p class="card-description flex-grow-1">{{recipe.description}}</p>
                            <a [routerLink]="'/recipes/details/' + recipe.id"
                                class="btn custom-btn-primary align-self-start">
                                View Recipe
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>
