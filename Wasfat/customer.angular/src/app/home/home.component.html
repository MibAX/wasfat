<ngb-carousel class="hero-carousel" [showNavigationArrows]="true" [showNavigationIndicators]="false">
    <ng-template *ngFor="let recipe of heroDisplayedRecipes" ngbSlide>
        <div class="carousel-img-wrapper">
            <img [src]="apiUrl + recipe.imageUrl" [alt]="recipe.name" class="d-block w-100" />
        </div>
        <div class="carousel-caption">
            <div class="container">
                <h1 class="fs-1 fw-bold mb-3">{{recipe.name}}</h1>
                <p class="lead mb-4">{{recipe.description | firstWords:10}}</p>
                <div class="d-flex flex-lg-row flex-column justify-content-center gap-3">
                    <a [routerLink]="['/recipes/list']" class="btn btn-gradient-orange btn-lg">Explore Recipes</a>
                    <a [routerLink]="['/recipes/details', recipe.id]" class="btn btn-outline-orange btn-lg">View Recipe</a>
                </div>
            </div>
        </div>
    </ng-template>
</ngb-carousel>

<section id="featured-recipes" class="p-4">
    <div class="container">
        <div id="featured-heading" class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fs-1 m-0">Featured Recipes</h2>
            <a routerLink="/recipes/list" class="featured-recipes-link d-flex align-items-center gap-2 fs-5">
                Explore all recipes
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="ms-1">
                    <path d="M9 18l6-6-6-6" />
                </svg>
            </a>
        </div>
        <hr class="opacity-25">
        <div id="featured-body">
            <div class="row py-4 g-4">
                <div *ngFor="let recipe of featuredRecipes" class="col-lg-4 col-md-6">
                    <div class="card h-100 border-0 shadow-sm">
                        <img class="card-img-top" [src]="apiUrl + recipe.imageUrl" [alt]="recipe.name">
                        <div class="card-body d-flex flex-column">
                            <h3 class="card-title mb-2 fs-4">{{ recipe.name }}</h3>
                            <p class="card-text text-muted flex-grow-1 fs-6">{{ recipe.description | firstWords:15 }}</p>
                            <a [routerLink]="'/recipes/details/' + recipe.id" class="btn btn-view-recipe mt-3 align-self-start">
                                View Recipe
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
