<div class="bg-white">
    <section class="page-header-primary">
        <div class="container">
            <h1 class="page-title">Explore Our Recipes</h1>
            <p class="page-subtitle">Discover delicious dishes from around the world</p>
        </div>
    </section>
    
    <div class="container py-4">
        <div class="d-flex flex-wrap justify-content-center gap-2">
            <button (click)="selectCategory(null)">
                All Recipes
            </button>
            <button *ngFor="let category of categoryLookups" (click)="selectCategory(category.id)">
                {{ category.displayName }}
            </button>
        </div>

        <div class="row pt-4 g-4">
            <div *ngFor="let recipe of filteredRecipes" class="col-lg-4 col-md-6">
                <div class="card">
                    <img [src]="apiUrl + recipe.imageUrl" alt="recipe.name" class="img-fluid rounded-3">
                    <div class="card-body">
                        <h4>{{recipe.name}}</h4>
                        <p class="card-description">{{recipe.description}}</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
