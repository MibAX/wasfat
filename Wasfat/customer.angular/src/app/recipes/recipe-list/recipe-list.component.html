<div class="container">
    <div class="row g-4">
        <div *ngFor="let recipe of recipes" class="col-lg-4 col-md-6">
            <div class="border border-black rounded-3 p-3 h-100">
                <img [src]="apiUrl + recipe.imageUrl" alt="recipe.name" class="img-fluid rounded-3">
                <h4 class="mt-3">Recipe: {{recipe.name}}</h4>
                <hr>
                <span>Description: {{recipe.description}}</span>
            </div>
        </div>
    </div>
</div>
