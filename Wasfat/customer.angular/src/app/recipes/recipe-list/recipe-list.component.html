<div class="recipe-list-page">
    <section class="page-header text-center">
        <div class="container">
            <h1 class="page-title">Explore Our Recipes</h1>
            <p class="page-subtitle">Discover delicious dishes from around the world</p>
        </div>
    </section>

    <div class="container">
        <div class="row mb-4">
            <div class="col-12">
                <div class="category-filters d-flex flex-wrap justify-content-center gap-2">
                    <button 
                        class="category-chip" 
                        [class.active]="selectedCategoryId === null"
                        (click)="selectCategory(null)">
                        All Recipes
                    </button>
                    <button 
                        *ngFor="let category of categories" 
                        class="category-chip"
                        [class.active]="selectedCategoryId === category.id"
                        (click)="selectCategory(category.id)">
                        {{ category.displayName }}
                    </button>
                </div>
            </div>
        </div>

        <div class="row py-4 g-4">
            <div *ngFor="let recipe of filteredRecipes" class="col-lg-4 col-md-6">
                <div class="card h-100 border-0 shadow-sm">
                    <img class="card-img-top" [src]="apiUrl + recipe.imageUrl" [alt]="recipe.name">
                    <div class="card-body d-flex flex-column">
                        <h3 class="card-title ff-rakkas mb-2 fs-4">{{ recipe.name }}</h3>
                        <p class="card-text text-muted flex-grow-1 fs-6">{{ recipe.description | firstWords:15 }}</p>
                        <a [routerLink]="'/recipes/details/' + recipe.id" class="btn btn-view-recipe mt-3 align-self-start">
                            View Recipe
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
