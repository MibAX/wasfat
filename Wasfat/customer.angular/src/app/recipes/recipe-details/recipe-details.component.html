<div class="bg-white">
    <section class="page-header-primary">
        <div class="container">
            <h1 class="page-title">{{ recipe?.name }}</h1>
            <div class="d-flex flex-wrap justify-content-center align-items-center gap-2">
                <p class="page-subtitle">Categories:</p>

                <button *ngFor="let category of recipe?.categories" class="custom-chip active">
                    {{ category.name }}
                </button>
            </div>
        </div>
    </section>

    <section class="recipe-hero">
        <div class="container">
            <div class="row g-0">
                <div class="col-lg-6">
                    <div class="hero-image-wrapper">
                        <img [src]="apiUrl + recipe?.imageUrl" [alt]="recipe?.name" />
                    </div>
                </div>

                <div class="col-lg-6 align-self-center">
                    <div class="d-flex flex-column justify-content-center text-center text-lg-start p-lg-5 px-5 pt-5 pb-0">
                        <h2 class="hero-title mb-3">What Makes This Special</h2>
                        <div class="hero-description">
                            <p>{{ recipe?.description }}</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>
