<div class="bg-white">
    <section class="page-header-primary">
        <div class="container">
            <h1 class="page-title">{{ recipe?.name }}</h1>
            <div class="d-flex flex-wrap justify-content-center align-items-center gap-2">
                <p class="page-subtitle">Categories:</p>

                <button *ngFor="let category of recipe?.categories" class="custom-chip active">
                    {{ category.name }}
                </button>
            </div>
        </div>
    </section>

    <section class="recipe-hero">
        <div class="container">
            <div class="row g-0">
                <div class="col-lg-6">
                    <div class="hero-image-wrapper">
                        <img [src]="apiUrl + recipe?.imageUrl" [alt]="recipe?.name" />
                    </div>
                </div>

                <div class="col-lg-6 align-self-center">
                    <div
                        class="d-flex flex-column justify-content-center text-center text-lg-start p-lg-5 px-5 pt-5 pb-0">
                        <h2 class="hero-title mb-3">What Makes This Special</h2>
                        <div class="hero-description">
                            <p>{{ recipe?.description }}</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div class="container">
        <section class="py-4">
            <h2 class="section-heading">Ingredients</h2>

            <div class="row">
                <div class="col-md-6" ngClass="ingredient-wrapper"
                    *ngFor="let recipeIngredient of recipe?.recipeIngredients">
                    <div class="ingredient-item">
                        <strong class="d-block">{{ getIngredientLabel(recipeIngredient.ingredientId) }}</strong>
                        <span>{{ recipeIngredient.quantity}} {{ getMeasurementUnitKey(recipeIngredient.unit) }}</span>
                    </div>
                </div>
            </div>
        </section>

        <section class="py-4">
            <h2 class="section-heading">Instructions</h2>
        
            <div class="row">
                <div class="col-md-12" ngClass="instruction-wrapper" *ngFor="let instruction of recipe?.instructions">
                    <div class="instruction-item d-flex align-items-center">
                        <span class="me-4">
                            <span class="step-badge">{{ instruction.order }}</span>
                        </span>
                        <span>{{ instruction.text }}</span>
                    </div>
                </div>
            </div>
        </section>
        </div>
        </div>
