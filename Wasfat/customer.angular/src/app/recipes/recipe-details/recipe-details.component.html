<div class="recipe-details-page">
    <div class="container">
        <div class="row justify-content-center py-5">
            <div class="col-12 col-xl-10">
                <div class="details-card shadow-lg">
                    <div class="row g-0 flex-column flex-lg-row">
                        <div class="col-lg-5 col-xl-6">
                            <img [src]="apiUrl + recipe?.imageUrl" [alt]="recipe?.name" class="recipe-hero" />
                        </div>
                        <div class="col-lg-7 col-xl-6 d-flex flex-column p-4 p-lg-5">
                            <h1 class="ff-rakkas mb-3 recipe-title">{{ recipe?.name }}</h1>
                            <p class="recipe-description mb-4">{{ recipe?.description }}</p>
                            <div class="d-flex align-items-center flex-wrap gap-2">
                                <span class="text-muted me-2">Categories:</span>
                                <mat-chip-listbox class="d-flex flex-wrap gap-2">
                                    <mat-chip *ngFor="let category of recipe?.categories" highlighted class="category-chip">
                                        {{ category.name }}
                                    </mat-chip>
                                </mat-chip-listbox>
                            </div>
                            <hr class="divider">
                            <section class="mb-5">
                                <h3 class="section-title">Ingredients</h3>
                                <ul class="list-group list-group-flush">
                                    <li class="list-group-item px-0 py-2" *ngFor="let ingredient of recipe?.recipeIngredients">
                                        <div class="d-flex justify-content-between align-items-center">
                                            <span>{{ getIngredientLabel(ingredient.ingredientId) }}</span>
                                            <span class="text-muted small">{{ ingredient.quantity }} {{ getMeasurementUnitName(ingredient.unit) }}</span>
                                        </div>
                                    </li>
                                </ul>
                            </section>
                            <section>
                                <h3 class="section-title">Instructions</h3>
                                <ol class="list-group list-group-numbered ps-0">
                                    <li class="list-group-item px-0 py-2 border-0 bg-transparent" *ngFor="let instruction of recipe?.instructions">
                                        {{ instruction.text }}
                                    </li>
                                </ol>
                            </section>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
