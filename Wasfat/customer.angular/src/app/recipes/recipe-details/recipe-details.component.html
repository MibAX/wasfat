<div class="recipe-details-page">
    <!-- Page Header -->
    <section class="page-header text-center">
        <div class="container">
            <h1 class="page-title">{{ recipe?.name }}</h1>
            <div class="category-display d-flex flex-wrap justify-content-center align-items-center gap-2 mt-3">
                <span class="category-label">Categories:</span>
                <button *ngFor="let category of recipe?.categories" class="category-chip">
                    {{ category.name }}
                </button>
            </div>
        </div>
    </section>

    <!-- Recipe Hero -->
    <div class="recipe-hero">
        <div class="container">
            <div class="row g-0">
                <div class="col-lg-6">
                    <div class="recipe-hero-image">
                        <img [src]="apiUrl + recipe?.imageUrl" [alt]="recipe?.name" />
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="recipe-hero-content">
                        <h2 class="content-title">About This Recipe</h2>
                        <div class="recipe-description">
                            <p>{{ recipe?.description }}</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Ingredients Section -->
    <div class="container my-5">
        <div class="row">
            <div class="col-12">
                <h2 class="section-heading">Ingredients</h2>
                
                <div class="row">
                    <div class="col-md-6" *ngFor="let column of [0, 1]">
                        <ul class="ingredients-list">
                            <li *ngFor="let ingredient of getIngredientsColumn(column)">
                                <strong>{{ getIngredientLabel(ingredient.ingredientId) }}</strong><br>
                                {{ ingredient.quantity }} {{ getMeasurementUnitName(ingredient.unit) }}
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Instructions Section -->
    <div class="container my-5">
        <div class="row">
            <div class="col-12">
                <h2 class="section-heading">Instructions</h2>
                
                <ol class="instructions-list">
                    <li *ngFor="let instruction of recipe?.instructions; let i = index">
                        <strong>Step {{ i + 1 }}:</strong> {{ instruction.text }}
                    </li>
                </ol>
            </div>
        </div>
    </div>
</div>
